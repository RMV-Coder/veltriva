<!doctype html>
<meta charset="utf-8">
<title>sensitive form</title>
<h1>Sensitive form fixture</h1>
<form onsubmit="return false">
  <p><label>Email <input id="email" type="email" autocomplete="email"></label></p>
  <p><label>Password <input id="pw" type="password" autocomplete="current-password"></label></p>
  <p><label>Card number <input id="cc" autocomplete="cc-number" inputmode="numeric"></label></p>
</form>
