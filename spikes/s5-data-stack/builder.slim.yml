# S5.4 variant 2: trimmed better-sqlite3 payload + the ADR-0007 Electron fuse set.
# Used by package.sh:  electron-builder --win --x64 --dir --projectDir s5-data-stack/app --config ../builder.slim.yml
electronVersion: 44.7.2
npmRebuild: false
directories:
  output: ../dist/slim
files:
  - "**/*"
  # Native module: keep lib/ + the win32-x64 prebuild only. deps/ (SQLite amalgamation) and src/ are build inputs.
  - "!node_modules/better-sqlite3/{deps,src}/**"
  - "!node_modules/better-sqlite3/prebuilds/{darwin-arm64,darwin-x64,linux-arm64,linux-x64,linuxmusl-arm64,linuxmusl-x64,win32-arm64}.node"
  - "!node_modules/node-addon-api/**"
win:
  target: dir
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
