<!doctype html>
<meta charset="utf-8">
<title>S4 overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  /* Solid blue so a window capture can tell the palette apart from the page beneath. */
  #palette { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); width: 520px; height: 160px; background: rgb(0, 0, 255); border-radius: 10px; }
</style>
<div id="palette"><input id="q" style="margin:12px;width:480px" value=""></div>
<script>
  window.paintAck = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(() => resolve(true))));
  window.focusState = () => ({ hasFocus: document.hasFocus(), active: document.activeElement?.tagName ?? null });
</script>
