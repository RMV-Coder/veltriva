<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lifecycle sign-in</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <p>A page with password and payment fields: a soft protection against discards (M3.1).</p>
    <form onsubmit="return false">
      <p><label>Password <input id="password" type="password" /></label></p>
      <p><label>Card <input id="card" autocomplete="cc-number" /></label></p>
    </form>
  </body>
</html>
