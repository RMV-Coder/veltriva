<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Image fixture</title>
    <style>
      body {
        margin: 0;
      }
      /* A known place for the context-menu specs to point at: the picture covers 20,20 to 84,84. */
      #picture {
        position: absolute;
        left: 20px;
        top: 20px;
        width: 64px;
        height: 64px;
      }
    </style>
  </head>
  <body>
    <img id="picture" src="/favicon.png" width="64" height="64" alt="A fixture picture" />
  </body>
</html>
