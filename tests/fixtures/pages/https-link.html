<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Link to a secure site fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: sans-serif;
      }
      a.link {
        display: block;
        box-sizing: border-box;
        width: 320px;
        padding: 10px 14px;
        border: 1px solid #888;
        background: #eee;
        color: #000;
        font: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Link to a secure site fixture</h1>
    <p>The address in <code>?to=</code> becomes this page's one link (M1.4b).</p>
    <a id="secure-link" class="link" href="#">The secure site</a>

    <script>
      const target = new URLSearchParams(window.location.search).get('to');
      if (target !== null) {
        document.getElementById('secure-link').href = target;
      }
    </script>
  </body>
</html>
