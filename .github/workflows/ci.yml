# Every push to main and every pull request (ADR-0008 §8, assessment §9.4). Each step runs the
# same npm script as the local gates, so a green run here means the same as a green run on a
# laptop (M6.3, docs/distribution/releasing.md). Third-party actions are pinned to full commit SHAs; the
# comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` with install scripts off (.npmrc), then Electron's binary, downloaded explicitly
      # and checked against its published checksums, then better-sqlite3's prebuilt binary
      # against the reviewed hash (scripts/sqlite-pin.mjs).
      - name: Install dependencies
        run: npm run setup

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Every unit test, measured: fails if src/core drops below 90% of lines or branches, or
      # src/data below 80% (ADR-0008 §1). Measuring costs little: on the dev laptop, with 2
      # workers, the coverage run took 73 s where `npm test` took 71 s.
      - name: Unit tests, with coverage
        run: npm run test:coverage

      # The production build, then its checks: no test hooks (ADR-0008 §4), only the data worker
      # loads SQLite, and THIRD_PARTY_NOTICES.txt lists every bundled package under an allowed
      # license (M6.1).
      - name: Build and check the release build
        run: npm run build:release

      # Builds the test variant (--mode test) itself, then runs Playwright.
      - name: E2E tests
        run: npm run test:e2e

      # Hidden-tab visibility and throttling, shutdown, crash recovery, measured without
      # Playwright, which masks them (ADR-0008 4a). Builds the test variant itself.
      - name: Lifecycle tests
        run: npm run test:lifecycle

      # main only: the unsigned installer, with the packaged-app checks (fuses read back, the
      # pinned SQLite binary, the licenses), kept as an artifact for a week.
      - name: Build the installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run package:installer

      - name: Upload the installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
