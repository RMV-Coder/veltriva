# electron-builder 26 (ADR-0007). `npm run package:dir` builds only the unpacked app in
# release/win-unpacked/. The per-user NSIS installer below is configured but not built yet.
# The identity values are one-way doors; src/main/app/identity.test.ts keeps them in sync with
# src/shared/constants/app-identity.ts.
appId: io.github.rmv-coder.veltriva
productName: Veltriva Browser
executableName: Veltriva
copyright: Copyright © 2026 Raymond Valdepeñas

directories:
  output: release

# Ship the electron-vite output, plus the one runtime dependency electron-builder copies from
# node_modules: better-sqlite3, trimmed to lib/, its license, package.json and the win32-x64
# binary (spike S5: 26 MiB unfiltered). node-addon-api holds C++ headers for building it only.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/{binding.gyp,README.md}'
  - '!node_modules/better-sqlite3/prebuilds/{darwin-arm64,darwin-x64,linux-arm64,linux-x64,linuxmusl-arm64,linuxmusl-x64,win32-arm64}.node'
  - '!node_modules/node-addon-api/**'

# Only the native binary leaves the archive: Windows can't map a DLL from inside app.asar.
# Electron redirects the worker's require() of it to app.asar.unpacked. The worker script and
# better-sqlite3's JavaScript load from inside app.asar (S5).
asar:
  smartUnpack: false
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/win32-x64.node

# Never rebuild native modules: better-sqlite3 13 (Phase 2) ships N-API prebuilds, and a
# rebuild would need Python and Visual Studio build tools (spike S5).
npmRebuild: false

# Hardened Electron fuses, flipped in the packaged binary only (ADR-0007 §3, assessment §6.2).
# Playwright needs `enableNodeCliInspectArguments`, so E2E runs against the unpackaged build.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true # One-way: turning it off later corrupts the cookie store.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  loadBrowserProcessSpecificV8Snapshot: false

win:
  target:
    - target: nsis
      arch:
        - x64

# Per-user installer that needs no admin rights (ADR-0007 §2).
nsis:
  oneClick: true
  perMachine: false
